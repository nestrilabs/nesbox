[package]
name = "virtio-devices"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
log = "0.4"
virtio-queue = "0.17"
virtio-bindings = "0.2"
vmm-sys-util = "0.15"
vm-memory.workspace = true
pci = { path = "../pci" }
rutabaga_gfx = { workspace = true, optional = true }
thiserror = "2.0"
displaydoc = "0.2"
libc = "0.2.189"
vhost = { version = "0.17.0", features = ["vhost-vsock", "vhost-net", "vhost-kern", "vhost-user-frontend"] }
io-uring = "0.7"

[features]
default = ["virgl"]
# The virtio-gpu device. Off means no rutabaga and no virglrenderer link, for a
# host that only ever forwards NVIDIA ioctls.
virgl = ["dep:rutabaga_gfx"]
