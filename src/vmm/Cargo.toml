[package]
name = "vmm"
version = "0.1.0"
authors = ["Amazon Firecracker team <firecracker-devel@amazon.com>"]
edition = "2024"
license = "Apache-2.0"

[lib]
bench = false

[features]
default = []
tracing = ["log-instrument"]
gdb = ["arrayvec", "gdbstub", "gdbstub_arch"]
fuzzing = []

[dependencies]
acpi_tables = { path = "../acpi-tables" }
arrayvec = { version = "0.7", optional = true }
aws-lc-rs = "1.16"
base64 = "0.22"
bitcode = { version = "0.6", features = ["serde"] }
bitflags = "2.11"
bitvec = { version = "1.0", features = ["atomic", "serde"] }
byteorder = "1.5"
crc64 = "2.0"
crossbeam-channel = "0.5"
derive_more = { version = "2.1", default-features = false, features = [
  "from",
  "display",
] }
displaydoc = "0.2"
event-manager = "0.4"
gdbstub = { version = "0.7", optional = true }
gdbstub_arch = { version = "0.3", optional = true }
kvm-bindings = { version = "0.14", features = ["fam-wrappers", "serde"] }
kvm-ioctls = "0.24"
libc = "0.2"
linux-loader = "0.13"
libloading = "0.8"
log = { version = "0.4", features = ["std", "serde"] }
log-instrument = { path = "../log-instrument", optional = true }
memfd = "0.6"
micro_http = { git = "https://github.com/firecracker-microvm/micro-http" }
nix = { version = "0.30", default-features = false, features = ["event", "fs", "ioctl", "mman", "ptrace", "signal", "socket", "uio", "user"] }
rutabaga_gfx = { path = "../rutabaga_gfx", features = ["virgl_renderer"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
slab = "0.4"
thiserror = "2.0"
userfaultfd = "0.9"
utils = { path = "../utils" }
uuid = "1.23"
vhost = { version = "0.15", features = ["vhost-user-frontend"] }
vm-allocator = { version = "0.1", features = ["serde"] }
vm-superio = "0.8"
vmm-sys-util = { version = "0.15", features = ["with-serde"] }
vm-memory = { version = "=0.17.1", features = [
  "backend-mmap",
  "backend-bitmap",
] }
zerocopy = { version = "0.8" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
vm-fdt = "0.3"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
device_tree = "1.1"
itertools = "0.14"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[[bench]]
name = "cpu_templates"
harness = false

[[bench]]
name = "queue"
harness = false

[[bench]]
name = "block_request"
harness = false

[[bench]]
name = "memory_access"
harness = false

[lints]
workspace = true
